[project]
name = "mcnb"
version = "0.1.0"
description = "音源を Minecraft Java Edition の音符ブロック演奏へ自動編曲するシステム"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "tomikan1208-code" }]

dependencies = [
    # --- Minecraft / NBS ---
    "hyperchoron>=1.1.17",   # MIT AND (Apache-2.0 OR BSD-2-Clause) — 中核として再利用
    "pynbs>=1.1.0",          # MIT
    "mcschematic>=11.4.3",   # Apache-2.0
    "nbtlib>=2.0.4",         # MIT
    # --- 音声解析 ---
    "librosa>=0.11.0",       # ISC
    "soundfile>=0.13.0",
    "numpy>=2.2",
    "scipy>=1.16",
    "mido>=1.3.3",           # MIT
    # --- 雑務 ---
    "tqdm>=4.67",
    "orjson>=3.11",
]

[project.optional-dependencies]
# 音源分離・採譜。重いので既定では入れない
transcribe = [
    "audio-separator[gpu]>=0.44",  # MIT（モデル重みは別ライセンス）
    "basic-pitch>=0.4.0",          # Apache-2.0
]
# 音声入力: YouTube などの URL から音源を取る + 音源分離・採譜
audio = [
    "yt-dlp>=2026.1.1",            # Unlicense
    "audio-separator[cpu]>=0.44",  # MIT（モデルの重みは別ライセンス）
    # setuptools 81+ は pkg_resources を落としたが resampy がまだ要求する
    "setuptools<81",
    # audio-separator 0.44 は audioread を要求するが宣言していない。
    # librosa 1.0 が audioread を落としたので明示的に入れる
    "audioread>=3.0",
    "audiotsm>=0.1.2",
    "imageio-ffmpeg>=0.6.0",       # ffmpeg 同梱
]
# GUI: 1画面から全部やる
gui = [
    "fastapi>=0.120",
    "uvicorn>=0.40",
    "python-multipart>=0.0.20",
]
# 実機測定（v1）: スピーカー出力のループバック録音
measure = [
    "PyAudioWPatch>=0.2.12.6 ; sys_platform == 'win32'",  # MIT / PyAudio の WASAPI ループバック対応フォーク
    "matplotlib>=3.10",
]
# 評価指標
eval = [
    "mir_eval>=0.8",
    "pyloudnorm>=0.1.1",
    "matplotlib>=3.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
mcnb = "mcnb.__main__:main"

[tool.uv]
# hyperchoron が litemapy>=0.11.0b0（プレリリースのみ）に依存している
prerelease = "allow"
# Microsoft Store 版 Python は WindowsApps の ACL のせいで venv 作成に失敗する
# (os error 6000)。uv が管理する standalone ビルドを使う。
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcnb"]
artifacts = ["src/mcnb/gui.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
