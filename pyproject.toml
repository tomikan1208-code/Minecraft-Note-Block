[project]
name = "mcnb"
version = "0.1.0"
description = "音源を Minecraft Java Edition の音符ブロック演奏へ自動編曲するシステム"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "tomikan1208-code" }]

dependencies = [
    # --- Minecraft / NBS ---
    "hyperchoron>=1.1.17",   # MIT AND (Apache-2.0 OR BSD-2-Clause) — 中核として再利用
    "pynbs>=1.1.0",          # MIT
    "mcschematic>=11.4.3",   # Apache-2.0
    "nbtlib>=2.0.4",         # MIT
    # --- 音声解析 ---
    "librosa>=0.11.0",       # ISC
    "soundfile>=0.13.0",
    "numpy>=2.2",
    "scipy>=1.16",
    "mido>=1.3.3",           # MIT
    # --- 雑務 ---
    "tqdm>=4.67",
    "orjson>=3.11",
]

[project.optional-dependencies]
# 音源分離・採譜。重いので既定では入れない
transcribe = [
    "audio-separator[gpu]>=0.44",  # MIT（モデル重みは別ライセンス）
    "basic-pitch>=0.4.0",          # Apache-2.0
]
# 評価指標
eval = [
    "mir_eval>=0.8",
    "pyloudnorm>=0.1.1",
    "matplotlib>=3.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
mcnb = "mcnb.__main__:main"

[tool.uv]
# hyperchoron が litemapy>=0.11.0b0（プレリリースのみ）に依存している
prerelease = "allow"
# Microsoft Store 版 Python は WindowsApps の ACL のせいで venv 作成に失敗する
# (os error 6000)。uv が管理する standalone ビルドを使う。
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcnb"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
